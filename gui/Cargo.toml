[workspace]
members = [
    "crates/codex-gui-shell",
    "crates/codex-gui-bridge",
    "crates/codex-gui-core",
    "crates/codex-gui-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[workspace.dependencies]
codex-gui-bridge = { path = "crates/codex-gui-bridge" }
codex-gui-core = { path = "crates/codex-gui-core" }
codex-gui-ui = { path = "crates/codex-gui-ui" }

# Vendored upstream: tagged release 0.14.0 (branch poc-0.14.0 in ../iced).
# Features mirror ../iced/Cargo.toml#L24-L91; `tokio` replaces the default
# `thread-pool` executor so the bridge can share one tokio runtime
# (executor priority: tokio > smol > thread-pool > null).
#
# `wgpu` is intentionally NOT enabled here: each renderer-facing crate gates
# it behind an optional feature of its own, so CI can build a tiny-skia-only
# binary for GPU-less environments (spec sections 7/10: `--no-default-features`).
iced = { version = "=0.14.0", default-features = false, features = [
    "tokio",
    "tiny-skia",
    "image",
    "canvas",
    "lazy",
    "markdown",
    "highlighter",
    "sipper",
    "x11",
    "wayland",
] }

# Native open/save dialogs (the "open folder" flow); async API pairs with
# `Task::future`.
rfd = "0.15"

# Directory-tree sidebar widget (lazy loading, filter, selection). Its `iced
# = "0.14"` dependency resolves to the same registry 0.14.0 this workspace
# pins, so both share one iced instance. Note: it enables iced's default
# features, which pulls `wgpu` into the build graph even for tiny-skia-only
# runs; runtime rendering stays on the software backend.
iced-swdir-tree = "0.9.3"

# Protocol types for the app-server JSON-RPC surface. Path dependency keeps
# the wire contract in lockstep with the main repo checkout.
codex-app-server-protocol = { path = "../codex-rs/app-server-protocol" }

anyhow = "1"
futures = "0.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Mirrored verbatim from codex-rs/Cargo.toml#L628-L633: the protocol dependency
# closure (codex-rollout -> codex-otel) requires the `proxy` feature that only
# exists in the OpenAI forks of tungstenite/tokio-tungstenite. Keep these revs
# in lockstep with the main repo workspace when upgrading.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# Software rasterization is CPU-bound: without optimization, tiny-skia's
# per-glyph work and font shaping dominate frame time (10-40x slower than
# optimized builds). Mirrors iced's official release profile; the dev entry
# keeps dependency crates optimized while local iteration stays fast.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 2
